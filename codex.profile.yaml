profile:
  name: network-validation-bootstrap
  version: 0.1.0
  description: Codex profile for incremental development of Jenkins + EKS network validation pipeline.

standards:
  language: python
  python_version: "3.11"
  typing: strong
  config_strategy: configuration-driven
  logging: structured-basic

execution:
  entrypoint: scripts/validate_network.py
  target_file_default: config/targets.yaml
  report_outputs:
    - reports/validation_report.json
    - reports/validation_report.html

pipeline:
  namespace: kube-system
  pod: net-utils
  stages:
    - Checkout
    - Prepare Environment
    - Configure Kubeconfig
    - Validate net-utils Pod
    - Run Network Validation
    - Publish Reports
